name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (test deps only -- the audio engines are heavy)
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy requests PyYAML ruamel.yaml soundfile
      - name: Ruff (new code; the inherited tree predates the lint rules)
        run: >
          ruff check meridianatc/security meridianatc/atc/guidance.py
          meridianatc/atc/continuous.py meridianatc/atc/surface.py
          meridianatc/atc/trainer.py meridianatc/atc/autofly.py
          meridianatc/history.py meridianatc/llm/rendering.py
          meridianatc/integrations/deepgram.py tests tools
      - name: Pytest
        run: python -m pytest tests -q

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build + test WPF shell
        run: dotnet test desktop/MeridianATC.Desktop.Tests -c Release

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ""
